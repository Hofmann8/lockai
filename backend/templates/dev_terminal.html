<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockAI Paper Monitor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #1a1e24;
  --border: #30363d; --text: #e6edf3; --muted: #8b949e;
  --accent: #58a6ff; --green: #3fb950; --red: #f85149;
  --yellow: #d29922; --purple: #bc8cff; --cyan: #39d2c0;
}
body { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; font-size: 13px; }

.topbar { display:flex; align-items:center; gap:12px; padding:8px 16px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
.topbar-title { color:var(--accent); font-weight:600; font-size:14px; }

.main { display:flex; flex:1; overflow:hidden; }

.sidebar { width:240px; background:var(--surface); border-right:1px solid var(--border); overflow-y:auto; flex-shrink:0; }
.sidebar-header { color:var(--muted); font-size:11px; padding:12px 12px 6px; text-transform:uppercase; letter-spacing:1px; }
.paper-item { padding:8px 12px; cursor:pointer; border-left:3px solid transparent; transition: background 0.15s; }
.paper-item:hover { background: var(--surface2); }
.paper-item.active { background: var(--bg); border-left-color: var(--accent); }
.paper-item .pid { color: var(--text); font-size: 12px; }
.paper-item .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

.content { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.events { flex:1; overflow-y:auto; padding:12px 16px; }
.status-bar { padding:6px 16px; background:var(--surface); border-top:1px solid var(--border); color:var(--muted); font-size:11px; display:flex; justify-content:space-between; }

/* Event blocks */
.evt { margin-bottom: 8px; }
.evt-progress { color: var(--cyan); }
.evt-progress .stage { color: var(--yellow); font-weight: 600; }
.evt-agent-start { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 10px; margin-top: 16px; font-weight: 600; }
.evt-agent-event { color: var(--muted); padding-left: 13px; font-size: 12px; }
.evt-gate { padding-left: 13px; }
.evt-gate.ok { color: var(--green); }
.evt-gate.fail { color: var(--red); }

.evt-llm-call { padding-left: 13px; color: var(--purple); }
.evt-llm-result { padding-left: 13px; }
.evt-llm-result .preview { background: var(--surface2); padding: 8px 12px; border-radius: 4px; border-left: 3px solid var(--purple); margin-top: 4px; white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto; font-size: 12px; color: var(--text); }

.evt-tool-call { padding-left: 13px; color: var(--yellow); }
.evt-tool-call pre { background: var(--surface2); padding: 8px 12px; border-radius: 4px; border-left: 3px solid var(--yellow); margin-top: 4px; white-space: pre-wrap; word-break: break-word; max-height: 150px; overflow-y: auto; font-size: 12px; color: var(--text); }
.evt-tool-result { padding-left: 13px; }
.evt-tool-result pre { background: var(--surface2); padding: 8px 12px; border-radius: 4px; border-left: 3px solid var(--green); margin-top: 4px; white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto; font-size: 12px; color: var(--text); }

.evt-compile { padding-left: 13px; }
.evt-compile.ok { color: var(--green); }
.evt-compile.fail { color: var(--red); }
.evt-compile pre { background: var(--surface2); padding: 8px 12px; border-radius: 4px; margin-top: 4px; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; font-size: 11px; color: var(--muted); }

.evt-error { color: var(--red); background: rgba(248,81,73,0.08); padding: 8px 12px; border-radius: 4px; border-left: 3px solid var(--red); }
.evt-completed { color: var(--green); font-weight: 600; margin-top: 12px; padding: 8px 12px; background: rgba(63,185,80,0.08); border-radius: 4px; border-left: 3px solid var(--green); }

.empty-state { color: var(--muted); text-align: center; padding: 60px 20px; }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }

/* Collapsible */
.collapsible { cursor: pointer; user-select: none; }
.collapsible::before { content: '▸ '; color: var(--muted); }
.collapsible.open::before { content: '▾ '; }
.collapsible-content { display: none; }
.collapsible.open + .collapsible-content { display: block; }

/* Input area for paper_id */
.input-bar { padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; }
.input-bar input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; font-family: inherit; font-size: 12px; outline: none; }
.input-bar input:focus { border-color: var(--accent); }
.input-bar button { background: var(--accent); color: #000; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">⬡ Paper Monitor</span>
  <span style="color:var(--muted); font-size:12px;">实时监控论文生成过程</span>
  <div style="flex:1;"></div>
  <button onclick="refreshPapers()" style="background:transparent; color:var(--muted); border:1px solid var(--border); padding:4px 10px; border-radius:4px; cursor:pointer; font-family:inherit; font-size:11px;">刷新列表</button>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">论文任务</div>
    <div id="paperList"></div>
    <div class="input-bar" style="border-top:1px solid var(--border); margin-top:auto;">
      <input id="paperIdInput" placeholder="输入 paper_id 订阅..." onkeydown="if(event.key==='Enter') subscribePaperId()">
      <button onclick="subscribePaperId()">订阅</button>
    </div>
  </div>

  <div class="content">
    <div id="events" class="events">
      <div class="empty-state">
        <div class="icon">⬡</div>
        <div>选择左侧的论文任务，或输入 paper_id 开始监控</div>
        <div style="margin-top:8px; font-size:11px;">生成论文时，这里会实时显示每个 Agent 的执行过程</div>
      </div>
    </div>
    <div class="status-bar">
      <span id="statusText">等待任务...</span>
      <span id="eventCount">0 事件</span>
    </div>
  </div>
</div>

<script>
let currentPaperId = null;
let eventSource = null;
let globalSource = null;
let eventCounter = 0;

// 全局事件流：自动发现新任务
function startGlobalStream() {
  if (globalSource) globalSource.close();
  globalSource = new EventSource('/dev/stream');
  globalSource.onmessage = (e) => {
    try {
      const event = JSON.parse(e.data);
      if (event.type === 'heartbeat') return;
      // 新任务出现时自动刷新列表
      if (event.type === 'created' || event.type === 'generate_start') {
        refreshPapers();
        // 如果当前没有在看任何 paper，自动订阅这个新的
        if (!currentPaperId) {
          subscribeTo(event.paper_id);
        }
      }
      // 如果当前没订阅具体 paper，也在面板上显示全局事件
      if (!currentPaperId) {
        renderEvent(event);
      }
    } catch {}
  };
  globalSource.onerror = () => {
    setTimeout(startGlobalStream, 3000);
  };
}

async function refreshPapers() {
  try {
    const resp = await fetch('/dev/papers');
    const papers = await resp.json();
    const list = document.getElementById('paperList');
    list.innerHTML = '';
    if (papers.length === 0) {
      list.innerHTML = '<div style="color:var(--muted); padding:12px; font-size:11px; text-align:center;">暂无任务<br><br>从前端发起论文生成后<br>这里会自动出现</div>';
      return;
    }
    papers.forEach(p => {
      const div = document.createElement('div');
      div.className = 'paper-item' + (p.paper_id === currentPaperId ? ' active' : '');
      const shortId = p.paper_id.substring(0, 12);
      const time = p.last_event_ts ? new Date(p.last_event_ts * 1000).toLocaleTimeString() : '';
      div.innerHTML = `<div class="pid">${esc(shortId)}...</div><div class="meta">${p.event_count} 事件 · ${p.last_event_type} · ${time}</div>`;
      div.onclick = () => subscribeTo(p.paper_id);
      list.appendChild(div);
    });
  } catch (e) {
    console.error('刷新失败:', e);
  }
}

function subscribePaperId() {
  const input = document.getElementById('paperIdInput');
  const pid = input.value.trim();
  if (pid) {
    subscribeTo(pid);
    input.value = '';
  }
}

function subscribeTo(paperId) {
  if (eventSource) {
    eventSource.close();
    eventSource = null;
  }
  currentPaperId = paperId;
  eventCounter = 0;
  clearEvents();
  setStatus('连接中...');
  refreshPapers();

  eventSource = new EventSource(`/dev/papers/${paperId}/stream?history=1`);

  eventSource.onmessage = (e) => {
    try {
      const event = JSON.parse(e.data);
      if (event.type === 'heartbeat') return;
      eventCounter++;
      renderEvent(event);
      document.getElementById('eventCount').textContent = `${eventCounter} 事件`;
    } catch {}
  };

  eventSource.onopen = () => setStatus(`监控中: ${paperId.substring(0, 12)}...`);
  eventSource.onerror = () => setStatus('连接断开，重连中...');
}

function clearEvents() {
  document.getElementById('events').innerHTML = '';
}

function setStatus(text) {
  document.getElementById('statusText').textContent = text;
}

function renderEvent(evt) {
  const container = document.getElementById('events');
  // 移除空状态提示
  const empty = container.querySelector('.empty-state');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'evt';

  const ts = evt.ts ? new Date(evt.ts * 1000).toLocaleTimeString() : '';
  const tsSpan = `<span style="color:var(--muted); font-size:10px; margin-right:8px;">${ts}</span>`;

  switch (evt.type) {
    case 'created':
      div.className = 'evt evt-completed';
      div.style.borderLeftColor = 'var(--accent)';
      div.style.background = 'rgba(88,166,255,0.08)';
      div.innerHTML = `${tsSpan}📄 论文创建: ${esc(evt.topic || '')} <span style="color:var(--muted); font-size:11px;">(${esc(evt.paper_id?.substring(0, 12) || '')}...)</span>`;
      break;

    case 'generate_start':
      div.className = 'evt evt-completed';
      div.style.borderLeftColor = 'var(--yellow)';
      div.style.background = 'rgba(210,153,34,0.08)';
      div.innerHTML = `${tsSpan}🚀 开始生成: ${esc(evt.topic || '')}`;
      break;

    case 'progress':
      div.className = 'evt evt-progress';
      div.innerHTML = `${tsSpan}<span class="stage">[${esc(evt.stage || '')}]</span> ${esc(evt.detail || '')}`;
      break;

    case 'agent_start':
      div.className = 'evt evt-agent-start';
      div.innerHTML = `${tsSpan}▶ ${esc(evt.agent)} 开始 (${esc(evt.stage || '')})`;
      break;

    case 'agent_event':
      div.className = 'evt evt-agent-event';
      const ae = evt.event || {};
      div.innerHTML = `${tsSpan}${esc(evt.agent)}: ${esc(ae.detail || ae.type || JSON.stringify(ae))}`;
      break;

    case 'gate_check':
      div.className = `evt evt-gate ${evt.ok ? 'ok' : 'fail'}`;
      const icon = evt.ok ? '✓' : '✗';
      div.innerHTML = `${tsSpan}${icon} Gate: ${esc(evt.agent)} ${evt.ok ? '通过' : '未通过'}${evt.reason ? ' — ' + esc(evt.reason) : ''}`;
      break;

    case 'llm_call':
      div.className = 'evt evt-llm-call';
      div.innerHTML = `${tsSpan}<span class="collapsible" onclick="toggleCollapse(this)">🤖 LLM 调用 (${esc(evt.agent)}, model: ${esc(evt.model || '')})</span><div class="collapsible-content"><div class="preview">${esc(evt.prompt_preview || '')}</div></div>`;
      break;

    case 'llm_result':
      div.className = 'evt evt-llm-result';
      div.innerHTML = `${tsSpan}<span class="collapsible" onclick="toggleCollapse(this)">📝 LLM 返回 (${esc(evt.agent)}, ${evt.length || 0} 字符)</span><div class="collapsible-content"><div class="preview">${esc(evt.preview || '')}</div></div>`;
      break;

    case 'tool_call':
      div.className = 'evt evt-tool-call';
      const argsStr = JSON.stringify(evt.arguments || {}, null, 2);
      div.innerHTML = `${tsSpan}<span class="collapsible" onclick="toggleCollapse(this)">🔧 Tool: ${esc(evt.tool)} (${esc(evt.agent)})</span><div class="collapsible-content"><pre>${esc(argsStr)}</pre></div>`;
      break;

    case 'tool_result':
      div.className = 'evt evt-tool-result';
      div.innerHTML = `${tsSpan}<span class="collapsible" onclick="toggleCollapse(this)">↩ Result: ${esc(evt.tool)}</span><div class="collapsible-content"><pre>${esc(evt.result || '')}</pre></div>`;
      break;

    case 'compile':
      div.className = `evt evt-compile ${evt.success ? 'ok' : 'fail'}`;
      const cIcon = evt.success ? '✓' : '✗';
      let compileHtml = `${tsSpan}${cIcon} 编译 #${evt.attempt || '?'}: ${evt.success ? '成功' : '失败'}`;
      if (evt.error) compileHtml += ` — ${esc(evt.error)}`;
      if (evt.log) compileHtml += `<span class="collapsible" onclick="toggleCollapse(this)" style="margin-left:8px; color:var(--muted); font-size:11px;">展开日志</span><div class="collapsible-content"><pre>${esc(evt.log)}</pre></div>`;
      div.innerHTML = compileHtml;
      break;

    case 'error':
      div.className = 'evt evt-error';
      div.innerHTML = `${tsSpan}❌ ${esc(evt.error || evt.stage || '')}${evt.agent ? ' (' + esc(evt.agent) + ')' : ''}`;
      break;

    case 'completed':
      div.className = 'evt evt-completed';
      div.innerHTML = `${tsSpan}✅ 论文生成完成${evt.pdf_url ? ' — <a href="' + esc(evt.pdf_url) + '" target="_blank" style="color:var(--accent);">下载 PDF</a>' : ''}`;
      break;

    default:
      div.innerHTML = `${tsSpan}<span style="color:var(--muted);">[${esc(evt.type)}]</span> ${esc(JSON.stringify(evt))}`;
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function toggleCollapse(el) {
  el.classList.toggle('open');
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// 初始化
refreshPapers();
startGlobalStream();
setInterval(refreshPapers, 10000);
</script>
</body>
</html>
